name: 🐛 Problem with a resource
description: Report a problem with an existing resource.
title: '[Problem]: '
body:
  - type: input
    id: resource
    attributes:
      label: Resource
      description: Link to the resource and identify the client used.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction steps
      description: Include expected and actual behavior.
    validations:
      required: true
